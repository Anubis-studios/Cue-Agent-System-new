services:
  - type: web
    name: cue-backend
    runtime: python
    plan: starter
    region: oregon
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: cue-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /data/cue.db
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_FALLBACK_CHAIN
        value: openrouter,groq,huggingface,gemini
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: cue-frontend
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: cd frontend && npm ci && npm run build
    startCommand: cd frontend && npm run start
    autoDeploy: true
    envVars:
      - key: BACKEND_HOST
        fromService:
          type: web
          name: cue-backend
          property: host
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NODE_VERSION
        value: 20.11.1

  - type: worker
    name: cue-worker
    runtime: python
    plan: starter
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.workers.video_worker
    disk:
      name: cue-worker-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /data/cue.db
      - key: PYTHON_VERSION
        value: 3.11.9
