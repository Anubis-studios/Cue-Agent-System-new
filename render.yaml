services:
  # ---------------- Backend web service (FastAPI) ----------------
  - type: web
    name: cue-backend
    runtime: python
    plan: starter
    region: oregon
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: cue-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /data/cue.db
      # Set DATABASE_URL (e.g. from the cue-db Postgres instance below) to use
      # real PostgreSQL instead of on-disk SQLite.
      - key: DATABASE_URL
        fromDatabase:
          name: cue-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: FIREWORKS_API_KEY
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: WANDB_API_KEY
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: JOHNNYBOT_API_KEY
        sync: false
      - key: MCP_SERVERS
        sync: false
      - key: SKILLS_DIR
        sync: false
      - key: LLM_FALLBACK_CHAIN
        value: openrouter,groq,gemini,huggingface,cohere,mistral,github,together,fireworks,cloudflare,wandb,deepseek,ollama,johnnybot
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7

  # ---------------- Frontend web service (Next.js) ----------------
  - type: web
    name: cue-frontend
    runtime: node
    plan: starter
    region: oregon
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: BACKEND_HOST
        fromService:
          type: web
          name: cue-backend
          property: host
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NODE_VERSION
        value: 20.11.1

  # ---------------- Worker service (job poller) ----------------
  - type: worker
    name: cue-worker
    runtime: python
    plan: starter
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.workers.video_worker
    autoDeploy: true
    disk:
      name: cue-worker-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /data/cue.db
      - key: DATABASE_URL
        fromDatabase:
          name: cue-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.7

databases:
  # Real managed PostgreSQL shared by backend + worker (Supabase/Neon also work:
  # just put their connection string in DATABASE_URL).
  - name: cue-db
    plan: starter
    region: oregon
    postgresMajorVersion: "16"
